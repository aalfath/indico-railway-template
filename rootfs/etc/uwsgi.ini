[uwsgi]
master = true
http-socket = [::]:$(PORT)
processes = $(UWSGI_PROCESSES)
enable-threads = true
py-call-uwsgi-fork-hooks = true
single-interpreter = true
die-on-term = true
vacuum = true
need-app = true
disable-logging = true
wsgi-file = /opt/indico/railway/wsgi.py
virtualenv = /opt/indico/.venv

# Static assets straight from uWSGI (falls through to Indico if a file isn't there)
offload-threads = 2
static-map = /dist=/opt/indico/static/dist
static-map = /css=/opt/indico/static/css
static-map = /fonts=/opt/indico/static/fonts
static-map = /images=/opt/indico/static/images

max-requests = 2500
harakiri = 900
ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true
reload-on-rss = 2048

# Celery worker with embedded beat, in the same container so it shares the volume.
attach-daemon2 = cmd=/opt/indico/railway/run-celery.sh,stopsignal=15,reloadsignal=15
