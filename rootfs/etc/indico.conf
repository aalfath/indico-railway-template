# Indico configuration for Railway. Every setting can be changed with an
# environment variable on the service; nothing here needs editing.
import os as _os

# Indico runs this file with separate globals and locals, so the helpers
# import what they need themselves instead of using module-level names.


def _env(name, default=None):
    import os
    value = os.environ.get(name, '').strip()
    return value if value else default


def _flag(name, default):
    import os
    value = os.environ.get(name, '').strip().lower()
    if not value:
        return default
    return value in ('1', 'true', 'yes', 'on')


# --- Core -------------------------------------------------------------------
_db_url = _env('DATABASE_URL', '')
if _db_url.startswith('postgres://'):
    _db_url = 'postgresql://' + _db_url[len('postgres://'):]
SQLALCHEMY_DATABASE_URI = _db_url

SECRET_KEY = _env('SECRET_KEY')
BASE_URL = (_env('BASE_URL') or 'https://' + _env('RAILWAY_PUBLIC_DOMAIN', 'localhost')).rstrip('/')
USE_PROXY = True

_redis = _env('REDIS_URL', 'redis://localhost:6379').rstrip('/')
REDIS_CACHE_URL = _redis + '/0'
CELERY_BROKER = _redis + '/1'

DEFAULT_TIMEZONE = _env('DEFAULT_TIMEZONE', 'UTC')
DEFAULT_LOCALE = _env('DEFAULT_LOCALE', 'en_GB')
ENABLE_ROOMBOOKING = _flag('ENABLE_ROOMBOOKING', True)

# --- Accounts ---------------------------------------------------------------
# New sign-ups wait for an admin's approval unless LOCAL_MODERATION=false.
LOCAL_REGISTRATION = _flag('LOCAL_REGISTRATION', True)
LOCAL_MODERATION = _flag('LOCAL_MODERATION', True)

# --- Email (optional; without SMTP_HOST Indico can't send mail) --------------
_domain = BASE_URL.split('://', 1)[-1].split('/', 1)[0].split(':', 1)[0]
NO_REPLY_EMAIL = _env('NO_REPLY_EMAIL', 'noreply@' + _domain)
# Indico requires SUPPORT_EMAIL (error reports go there); set it to a real inbox.
SUPPORT_EMAIL = _env('SUPPORT_EMAIL', NO_REPLY_EMAIL)
PUBLIC_SUPPORT_EMAIL = _env('PUBLIC_SUPPORT_EMAIL')
SMTP_SERVER = (_env('SMTP_HOST', 'localhost'), int(_env('SMTP_PORT', '25')))
SMTP_LOGIN = _env('SMTP_USERNAME')
SMTP_PASSWORD = _env('SMTP_PASSWORD')
SMTP_USE_TLS = _flag('SMTP_USE_TLS', False)
SMTP_USE_SSL = _flag('SMTP_USE_SSL', False)

# --- Paths: everything persistent lives on the volume at /opt/indico/data ----
LOG_DIR = '/opt/indico/log'
TEMP_DIR = '/opt/indico/tmp'
CACHE_DIR = '/opt/indico/cache'
CUSTOMIZATION_DIR = '/opt/indico/data/custom'
STORAGE_BACKENDS = {'default': 'fs:/opt/indico/data/archive'}
ATTACHMENT_STORAGE = 'default'
LOGGING_CONFIG_FILE = 'logging.yaml'

# --- Plugins (comma-separated names from the indico-plugins package) --------
PLUGINS = {p.strip() for p in _env('INDICO_PLUGINS', 'previewer_code,payment_manual').split(',') if p.strip()}

del _os, _env, _flag, _db_url, _redis, _domain
